name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '^10.0'
            testbench: '^8.0'
            dependencies: lowest
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
            dependencies: highest
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            dependencies: highest
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            dependencies: highest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Laravel dependencies
        run: |
          composer require laravel/framework:${{ matrix.laravel }} illuminate/support:${{ matrix.laravel }} orchestra/testbench:${{ matrix.testbench }} --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --prefer-${{ matrix.dependencies }}

      - name: Run tests
        run: composer test
